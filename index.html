  }
};

let editTimer = 0;
document.addEventListener('click', ev => {
  const app = $('#app'); if (!app.contains(ev.target)) return;
  if (ui.sbOpen && !ev.target.closest('#sidebar') && !ev.target.closest('[data-act="toggle-sidebar"]')) { ui.sbOpen = false; $('.shell').classList.remove('sb-open'); }
  const task = ev.target.closest('input[data-task]');
  if (task && task.closest('#desc-slot')) { const id = ui.route.id, n = +task.dataset.task; Store.mutate('Toggle checklist item', s => { const i = FD.findIssue(s, id); FD.setField(s, i, 'description', FD.toggleTask(i.description, n)); }, { coalesce: 'tasks:' + id }); return; }
  if (task) { ev.preventDefault(); return; }
  if (ev.target.closest('.md a')) return;
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = Acts[el.dataset.act]; if (!fn) return;
  ev.preventDefault(); fn(el, ev);
});
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.input && Inputs[el.dataset.input]) Inputs[el.dataset.input](el); else if (el.dataset && el.dataset.edit) { autosize(el); clearTimeout(editTimer); editTimer = setTimeout(flushEditors, 900); } });
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset && el.dataset.change && Changes[el.dataset.change]) Changes[el.dataset.change](el); });
document.addEventListener('focusout', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.edit) return;
  if (el.dataset.edit === 'title') { if (!el.value.trim()) { const i = FD.findIssue(S(), ui.route.id); if (i) el.value = i.title; } flushEditors(); }
  else if (el.dataset.edit === 'desc') {
    /* Swap in place rather than re-rendering, so the click that caused the blur still lands. */
    flushEditors(); ui.editingDesc = false;
    const slot = $('#desc-slot'), i = FD.findIssue(S(), ui.route.id); if (slot && i && document.contains(el)) slot.innerHTML = descHTML(i);
  }
});
document.addEventListener('contextmenu', ev => {
  const row = ev.target.closest && ev.target.closest('#main .row[data-id], #main .card[data-id], #main .sub-row[data-id]'); if (!row) return;
  ev.preventDefault();
  const id = row.dataset.id; let ids = [id];
  if (ui.selected.has(id) && ui.selected.size > 1) ids = targets(); else if (ui.selected.size && isListRoute()) { ui.selected.clear(); render(); }
  if (isListRoute()) setCursor(id, false);
  Menu.open({ anchor: { left: ev.clientX, top: ev.clientY }, width: 240, items: issueMenuItems(ids) });
});
document.addEventListener('mousemove', ev => {
  if (ui.kbdNav) { if (Math.abs(ev.movementX) + Math.abs(ev.movementY) < 2) return; ui.kbdNav = false; }
  if (Menu.isOpen() || Dialog.isOpen() || drag) return;
  const el = ev.target.closest && ev.target.closest('#main .row[data-id], #main .card[data-id]');
  if (el && el.dataset.id !== ui.cursor) setCursor(el.dataset.id, false);
});

/* ── drag and drop ──────────────────────────────────── */
let drag = null;
const dropLine = document.createElement('div'); dropLine.className = 'drop-line';
function endDrag() { dropLine.remove(); $$('.dragging').forEach(e => e.classList.remove('dragging')); $$('.col.over').forEach(e => e.classList.remove('over')); drag = null; }
document.addEventListener('dragstart', ev => {
  const el = ev.target.closest && ev.target.closest('#main [draggable="true"][data-id]'); if (!el) return;
  const id = el.dataset.id, ids = ui.selected.has(id) ? ui.visible.filter(x => ui.selected.has(x)) : [id];
  drag = { ids }; ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', ids.join(', '));
  requestAnimationFrame(() => { if (drag) ids.forEach(x => $$('#main [data-id="' + x + '"]').forEach(e => e.classList.add('dragging'))); });
});
document.addEventListener('dragover', ev => {
  if (!drag) return;
  const zone = ev.target.closest && ev.target.closest('[data-drop]');
  $$('.col.over').forEach(e => { if (!zone || e !== zone.closest('.col')) e.classList.remove('over'); });
  if (!zone) { dropLine.remove(); drag.zone = null; return; }
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
  const kids = $$(':scope > [data-id]', zone).filter(e => !drag.ids.includes(e.dataset.id));
  const before = kids.find(e => { const r = e.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; }), last = kids[kids.length - 1];
  drag.zone = zone.dataset.drop; drag.before = before ? before.dataset.id : null;
  const col = zone.closest('.col'); if (col) col.classList.add('over');
  const gap = col ? 3 : 0;
  dropLine.style.top = (before ? before.offsetTop - gap - 1 : last ? last.offsetTop + last.offsetHeight + gap - 1 : 2) + 'px';
  if (dropLine.parentNode !== zone) zone.append(dropLine);
});
document.addEventListener('drop', ev => {
  if (!drag) return;
  ev.preventDefault();
  const { ids, zone, before } = drag; endDrag();
  if (!zone) return;
  const g = ui.groups.find(x => x.key === zone), d = display(); if (!g) return;
  const sameGroup = ids.every(id => g.issues.some(i => i.id === id));
  Store.mutate(ids.length > 1 ? 'Move ' + ids.length + ' issues' : 'Move ' + ids[0], s => {
    const list = ids.map(id => FD.findIssue(s, id)).filter(Boolean);
    if (g.field) for (const i of list) FD.setField(s, i, g.field, g.value);
    else if (d.group === 'label' && g.value) for (const i of list) if (!i.labels.includes(g.value)) FD.setField(s, i, 'labels', [...i.labels, g.value]);
    if (d.sort === 'manual') FD.reorder(s, list.map(i => i.id), g.issues.map(i => FD.findIssue(s, i.id)).filter(Boolean), before);
  });
  if (d.sort !== 'manual' && sameGroup) toast('This view is ordered by ' + (FD.SORTS.find(x => x.id === d.sort) || {}).name.toLowerCase() + '. Switch Display → Ordering to Manual to drag-reorder.');
});
document.addEventListener('dragend', endDrag);

/* ── paste anywhere ─────────────────────────────────── */
document.addEventListener('paste', ev => {
  const t = ev.target, editable = t && t.matches && t.matches('input, textarea, [contenteditable]');
  if (editable || Menu.isOpen() || Dialog.isOpen()) return;
  const text = (ev.clipboardData || window.clipboardData).getData('text/plain') || '';
  if (!text.trim()) return;
  ev.preventDefault();
  if (receiveReply(text)) { if (ui.route.name === 'copilot') render(); else go('copilot'); return; }
  if (/"ops"|```|"op"\s*:/.test(text)) { toast(ui.cp.error, { err: true, ms: 7000 }); ui.cp.error = ''; return; }
  ui.cp.error = '';
  const lines = text.split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•]\s+|\d+[.)]\s+)?(?:\[[ xX]?\]\s+)?/, '').trim()).filter(Boolean).slice(0, 200);
  if (lines.length > 1) openNewIssue({ bulk: lines }); else openNewIssue({ title: lines[0].slice(0, 300) });
});

/* ── keyboard ───────────────────────────────────────── */
let chordTimer = 0;
const GO = { i: 'inbox', f: 'focus', a: 'active', b: 'backlog', e: 'all', p: 'projects', c: 'copilot', s: 'settings' };
document.addEventListener('keydown', ev => {
  if (Menu.isOpen()) return;
  const mod = ev.metaKey || ev.ctrlKey, k = ev.key, low = k.length === 1 ? k.toLowerCase() : k;
  if (mod && low === 'k') { ev.preventDefault(); openPalette(); return; }
  if (Dialog.isOpen()) { if (k === 'Escape') { ev.preventDefault(); Dialog.close(); } else if (mod && k === 'Enter') { ev.preventDefault(); Dialog.submit(); } return; }
  const t = ev.target, editable = t.matches && t.matches('input, textarea, select, [contenteditable]');
  if (editable) {
    const keep = t.dataset.keep, edit = t.dataset.edit;
    if (k === 'Escape') { ev.preventDefault(); if (keep === 'search' && t.value) { t.value = ''; Inputs.search(t); } else t.blur(); return; }
    if (edit === 'title' && k === 'Enter') { ev.preventDefault(); t.blur(); }
    else if (edit === 'desc' && mod && k === 'Enter') { ev.preventDefault(); t.blur(); }
    else if (keep === 'comment' && mod && k === 'Enter') { ev.preventDefault(); Acts['send-comment'](); }
    else if (keep === 'sub' && k === 'Enter') {
      ev.preventDefault(); const title = t.value.trim(), pid = ui.route.id; if (!title) return;
      ui.draftSub = ''; Store.mutate('Add sub-issue', s => { const p = FD.findIssue(s, pid); FD.createIssue(s, { title, parent: pid, project: p.project, status: 'todo' }); });
    }
    else if (keep === 'search' && (k === 'Enter' || k === 'ArrowDown')) { ev.preventDefault(); t.blur(); moveCursor(1); }
    else if (keep === 'cp-reply' && mod && k === 'Enter' && ui.cp.plan) { ev.preventDefault(); applyReview(); }
    return;
  }
  if (mod && low === 'z') { ev.preventDefault(); if (ev.shiftKey) doRedo(); else doUndo(); return; }
  if (mod && low === 'y') { ev.preventDefault(); doRedo(); return; }
  const r = ui.route, list = isListRoute(r), onIssue = r.name === 'issue', review = r.name === 'copilot' && ui.cp.plan;
  if (review) { if (mod && k === 'Enter') { ev.preventDefault(); applyReview(); return; } if (k === 'Escape') { ev.preventDefault(); Acts['rv-discard'](); return; } }
  if (mod && low === 'a' && list) { ev.preventDefault(); ui.visible.forEach(id => ui.selected.add(id)); render(); return; }
  if (mod && k === 'Backspace') { const ids = targets(); if (ids.length) { ev.preventDefault(); deleteIssues(ids); } return; }
  if (mod || ev.altKey) return;
  if (ui.chord === 'g') { ui.chord = null; clearTimeout(chordTimer); if (GO[low]) { ev.preventDefault(); go(GO[low]); return; } }
  const ids = targets(), has = ids.length > 0;
  const hit = fn => { ev.preventDefault(); fn(); };
  switch (low) {
    case 'g': if (!ev.shiftKey) { ui.chord = 'g'; clearTimeout(chordTimer); chordTimer = setTimeout(() => { ui.chord = null; }, 1300); ev.preventDefault(); } return;
    case 'c': if (!ev.shiftKey) hit(() => openNewIssue()); return;
    case '/': if (list) hit(() => { const el = $('[data-keep="search"]'); if (el) { el.focus(); el.select(); } }); else hit(openPalette); return;
    case '?': hit(openShortcuts); return;
    case '[': hit(() => Acts['toggle-sidebar']()); return;
    case 'Escape':
      if (list && ui.selected.size) hit(() => { ui.selected.clear(); render(); });
      else if (onIssue) hit(goBack);
      else if (r.name === 'copilot' || r.name === 'settings' || r.name === 'projects') hit(goBack);
      return;
    case 'j': case 'ArrowDown': if (list) hit(() => moveCursor(1, ev.shiftKey)); else if (onIssue && low === 'j') hit(() => Acts['issue-nav']({ dataset: { v: 1 } })); return;
    case 'k': case 'ArrowUp': if (list) hit(() => moveCursor(-1, ev.shiftKey)); else if (onIssue && low === 'k') hit(() => Acts['issue-nav']({ dataset: { v: -1 } })); return;
    case 'Enter': case 'o': if (list && ui.cursor) hit(() => go('issue/' + ui.cursor)); return;
    case 'x': if (list && ui.cursor) hit(() => toggleSelect(ui.cursor, ev.shiftKey)); return;
    case 'b': if (list) hit(() => setDisplay({ layout: display().layout === 'board' ? 'list' : 'board' })); return;
    case 'f': if (ev.shiftKey) { if (has) hit(() => Pick.focus(issueTarget(ids))); } else if (list) hit(() => openFilterMenu($('[data-act="filter-menu"]'))); return;
    case 's': if (has) hit(() => pickFor('status', ids)); return;
    case 'p': if (has) hit(() => pickFor(ev.shiftKey ? 'project' : 'priority', ids)); return;
    case 'l': if (has) hit(() => pickFor('labels', ids)); return;
    case 'd': if (has) hit(() => pickFor('due', ids)); return;
    case 'a': if (has) hit(() => pickFor('assignee', ids)); return;
    case 'e': hit(() => { if (has) openCopilotMenu(null, ids); else go('copilot'); }); return;
    case 'Backspace': case 'Delete': if (has) hit(() => deleteIssues(ids)); return;
    case '1': case '2': if (r.name === 'inbox' && has) hit(() => setField(ids, 'status', low === '1' ? 'todo' : 'backlog')); return;
  }
});

/* ── boot ───────────────────────────────────────────── */
window.addEventListener('error', ev => { if (ev && ev.message && !/ResizeObserver/.test(ev.message)) { try { toast('Something went wrong: ' + ev.message, { err: true, ms: 8000 }); } catch (e) { /* layer not ready */ } } });
window.addEventListener('unhandledrejection', ev => { const m = ev.reason && (ev.reason.message || String(ev.reason)); if (m && !/AbortError/.test(String(ev.reason && ev.reason.name))) { try { toast('Something went wrong: ' + m, { err: true, ms: 8000 }); } catch (e) { /* layer not ready */ } } });
(async function boot() {
  let info;
  try { info = await Store.boot(); }
  catch (e) { $('#app').innerHTML = '<div class="empty" style="height:100vh"><div><h3>Flight Deck could not start</h3><p>' + esc((e && e.message) || String(e)) + '</p></div></div>'; return; }
  applyTheme();
  pwaInit();
  let lastFile = Store.status().fileState;
  Store.subscribe(() => { applyTheme(); render(); });
  Store.onStatus(() => { const el = $('#save-chip'); if (el) el.outerHTML = saveChipHTML(); const fs = Store.status().fileState; if (fs !== lastFile) { lastFile = fs; if (ui.route.name === 'settings') render(); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('pagehide', () => { flushEditors(); Store.save(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushEditors(); });
  if (!location.hash) { try { history.replaceState(null, '', '#/active'); } catch (e) { location.hash = '#/active'; } }
  onRoute();
  setInterval(() => { if (!document.hidden && !drag && !Menu.isOpen() && !Dialog.isOpen() && !(document.activeElement && document.activeElement.matches('input, textarea'))) render(); }, 60000);
  if (info.notice) toast(info.notice, { ms: 9000 });
})();
</script>
</body>

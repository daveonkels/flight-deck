<title>Flight Deck</title>
<style data-fd>
/* Flight Deck — styles. Dark-first instrument panel; light theme is warm paper. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --accent: #f5a524; --accent-ink: #1c1303; --accent-text: #f5b84a;
  --bg: #0c0d0f; --panel: #121316; --raised: #1a1c20; --sunken: #0f1012;
  --hover: rgba(255,255,255,.045); --active: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
  --text: #e8e9eb; --text-2: #a0a4ab; --text-3: #6a6f77; --text-4: #464a51;
  --red: #f2555a; --orange: #f7833b; --yellow: #f2c94c; --green: #3fb97c; --blue: #4c9aff; --violet: #a78bfa;
  --shadow: 0 16px 48px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --radius: 8px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --accent-text: #b46a00;
  --bg: #f3f2ee; --panel: #fdfdfc; --raised: #ffffff; --sunken: #f6f5f2;
  --hover: rgba(20,18,10,.045); --active: rgba(20,18,10,.08);
  --line: rgba(20,18,10,.085); --line-2: rgba(20,18,10,.15);
  --text: #1a1b1d; --text-2: #5d6168; --text-3: #8b8f96; --text-4: #b9bcc1;
  --red: #d93d42; --orange: #d9661b; --yellow: #c79a12; --green: #2a9d63; --blue: #2f7fe6; --violet: #7c5ce0;
  --shadow: 0 16px 48px rgba(30,25,10,.16), 0 2px 8px rgba(30,25,10,.08);
  color-scheme: light;
}
:root[data-accent="cyan"]   { --accent: #2cc4e4; --accent-ink: #03181d; --accent-text: #4fd2ee; }
:root[data-accent="violet"] { --accent: #8f7bf0; --accent-ink: #0d0825; --accent-text: #a999f5; }
:root[data-accent="green"]  { --accent: #3ecf8e; --accent-ink: #03170d; --accent-text: #5bdaa2; }
:root[data-accent="rose"]   { --accent: #f0609a; --accent-ink: #22030f; --accent-text: #f582b0; }
:root[data-theme="light"][data-accent="cyan"]   { --accent-text: #0a7f99; }
:root[data-theme="light"][data-accent="violet"] { --accent-text: #5b43cc; }
:root[data-theme="light"][data-accent="green"]  { --accent-text: #15804d; }
:root[data-theme="light"][data-accent="rose"]   { --accent-text: #c22a68; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: none; }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 1px; border-radius: 5px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, .menu:focus-visible { outline: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-4); border: 3px solid transparent; background-clip: content-box; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 14px; height: 14px; }
kbd { font: 500 10.5px/1 var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 4px; min-width: 18px; text-align: center; display: inline-block; background: var(--hover); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.micro { font: 600 10px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--text-3); }
.hidden { display: none !important; }

/* ── shell ─────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }
.shell.sb-off { grid-template-columns: minmax(0, 1fr); }
.shell.sb-off .sidebar { display: none; }
.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 10px 8px 8px 10px; position: relative; }
.sidebar::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 130px; pointer-events: none;
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%); }
.sb-head { display: flex; align-items: center; gap: 4px; position: relative; }
.ws-btn { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; min-width: 0; flex: 1; font-weight: 600; letter-spacing: -.01em; }
.ws-btn:hover { background: var(--hover); }
.brand-mark { width: 22px; height: 22px; flex: none; }
.sb-actions { display: flex; gap: 6px; margin: 10px 0 12px; position: relative; }
.sb-new { flex: 1; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line-2); font-weight: 500; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.sb-new:hover { border-color: var(--text-4); }
.sb-new kbd { margin-left: auto; }
.sb-search { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; background: var(--raised); border: 1px solid var(--line-2); color: var(--text-2); }
.sb-search:hover { color: var(--text); border-color: var(--text-4); }
.sb-nav { flex: 1; min-height: 0; overflow-y: auto; margin-right: -4px; padding-right: 4px; }
.sb-item { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--text-2); width: 100%; font-weight: 500; }
.sb-item:hover { background: var(--hover); color: var(--text); }
.sb-item.on { background: var(--active); color: var(--text); }
.sb-item .ico { color: var(--text-3); }
.sb-item.on .ico, .sb-item:hover .ico { color: var(--text-2); }
.sb-item.copilot .ico { color: var(--accent-text); }
.sb-count { margin-left: auto; font: 500 11px var(--mono); color: var(--text-3); }
.sb-count.hot { color: var(--accent-text); }
.sb-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; margin: 0 3.5px; }
.sb-title { display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 6px; }
.sb-add { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: var(--text-3); }
.sb-add:hover { background: var(--hover); color: var(--text); }
.sb-ring { width: 14px; height: 14px; flex: none; margin: 0 1px; }
.pips { display: inline-flex; gap: 3px; margin-left: auto; align-items: center; }
.pips i { width: 5px; height: 9px; border-radius: 1.5px; background: var(--text-4); }
.pips i.on { background: var(--accent); }
.pips i.over { background: var(--red); }
.sb-foot { display: flex; align-items: center; gap: 4px; padding-top: 8px; }
.save-chip { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--text-3); font-size: 12px; flex: 1; min-width: 0; }
.save-chip:hover { background: var(--hover); color: var(--text-2); }
.save-chip .led { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent); flex: none; }
.save-chip.warn .led { background: var(--orange); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 18%, transparent); }
.save-chip.busy .led { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.on { background: var(--active); color: var(--text); }
.tb-toggle { display: none; margin-left: -6px; }
.shell.sb-off .tb-toggle { display: inline-grid; }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }

.main { margin: 8px 8px 8px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.shell.sb-off .main { margin-left: 8px; }
.topbar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); flex: none; }
.tb-title { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; min-width: 0; }
.tb-title .ico { color: var(--text-3); }
.tb-count { font: 500 11px var(--mono); color: var(--text-3); }
.tb-crumb { color: var(--text-3); font-weight: 500; }
.tb-crumb:hover { color: var(--text); }
.tb-sep { color: var(--text-4); }
.tb-search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--text-3); width: 190px; border: 1px solid transparent; }
.tb-search:focus-within { border-color: var(--line-2); background: var(--sunken); color: var(--text-2); }
.tb-search input { background: none; border: 0; width: 100%; min-width: 0; }
.tb-search input::placeholder { color: var(--text-3); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 6px; color: var(--text-2); font-weight: 500; white-space: nowrap; border: 1px solid transparent; flex: none; }
.btn:hover { background: var(--hover); color: var(--text); }
.btn.line { border-color: var(--line-2); background: var(--raised); color: var(--text); }
.btn.line:hover { border-color: var(--text-4); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary kbd, .btn.danger.solid kbd { color: inherit; border-color: rgba(0,0,0,.22); background: rgba(0,0,0,.07); opacity: .75; }
.btn.danger { color: var(--red); }
.btn.danger.solid { background: var(--red); color: #fff; }
.btn.big { height: 34px; padding: 0 14px; font-size: 13.5px; border-radius: 8px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn .n { font: 600 10.5px var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 5px; }
.btn.copilot .ico { color: var(--accent-text); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; padding: 1px; background: var(--sunken); }
.seg button { height: 24px; padding: 0 8px; border-radius: 4.5px; color: var(--text-3); display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line-2), 0 1px 2px rgba(0,0,0,.25); }
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 14px; border-bottom: 1px solid var(--line); flex: none; }
.fchip { display: inline-flex; align-items: center; height: 24px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 12px; overflow: hidden; background: var(--raised); }
.fchip > span, .fchip > button { padding: 0 7px; height: 100%; display: inline-flex; align-items: center; gap: 5px; }
.fchip .k { color: var(--text-3); border-right: 1px solid var(--line); }
.fchip .v:hover, .fchip .x:hover { background: var(--hover); }
.fchip .x { color: var(--text-3); border-left: 1px solid var(--line); padding: 0 5px; }
.content { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ── status / priority glyphs ───────────────────────── */
.st { width: 14px; height: 14px; flex: none; display: block; }
.st-triage { color: var(--red); } .st-backlog { color: var(--text-3); } .st-todo { color: var(--text-2); }
.st-progress { color: var(--blue); } .st-review { color: var(--violet); } .st-done { color: var(--green); } .st-canceled { color: var(--text-3); }
.pr { width: 14px; height: 14px; flex: none; display: block; color: var(--text-2); }
.pr-1 { color: var(--orange); } .pr-0 { color: var(--text-4); }
.avatar { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font: 600 8.5px var(--mono); color: #fff; letter-spacing: 0; }
.avatar.none { border: 1px dashed var(--text-4); color: var(--text-4); background: none; }
.avatar.copilot { background: color-mix(in srgb, var(--accent) 20%, var(--raised)); color: var(--accent-text); }
.avatar.lg { width: 22px; height: 22px; font-size: 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--line-2); font-size: 11.5px; color: var(--text-2); white-space: nowrap; max-width: 140px; }
.pill i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pill.proj i { border-radius: 2px; }
.pill.more { padding: 0 6px; color: var(--text-3); }
.due { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.due.over { color: var(--red); } .due.soon { color: var(--orange); }
.focus-mark { color: var(--accent-text); display: inline-grid; }

/* ── list ───────────────────────────────────────────── */
.list { padding-bottom: 80px; }
.group-head { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 14px; background: var(--sunken); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; font-weight: 600; cursor: default; }
.group + .group .group-head { border-top: 1px solid var(--line); margin-top: -1px; }
.group-head .chev { color: var(--text-3); transition: transform .12s; }
.group.shut .chev { transform: rotate(-90deg); }
.group.shut .rows { display: none; }
.group-head .cnt { font: 500 11px var(--mono); color: var(--text-3); }
.group-head .icon-btn { width: 24px; height: 24px; margin-left: auto; opacity: 0; }
.group-head:hover .icon-btn { opacity: 1; }
.gdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.rows { position: relative; min-height: 4px; }
.row { scroll-margin-top: 36px; display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 14px 0 6px; border-bottom: 1px solid var(--line); cursor: default; position: relative; }
.row.cursor { background: var(--hover); }
.row.selected { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.row.selected.cursor { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.row.cursor::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.row.closed .r-title .t { color: var(--text-3); }
.row.dragging, .card.dragging { opacity: .35; }
.r-check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-2); flex: none; display: grid; place-items: center; opacity: 0; color: var(--accent-ink); }
.row:hover .r-check, .row.cursor .r-check, .row.selected .r-check, .list.selecting .r-check { opacity: 1; }
.row.selected .r-check, .card.selected .r-check { background: var(--accent); border-color: var(--accent); opacity: 1; }
.r-check svg { width: 10px; height: 10px; stroke-width: 2.4; opacity: 0; }
.selected .r-check svg { opacity: 1; }
.r-hit { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; flex: none; }
.r-hit:hover { background: var(--active); }
.r-id { font: 500 11.5px var(--mono); color: var(--text-3); width: 52px; flex: none; white-space: nowrap; letter-spacing: -.01em; }
.r-title { display: flex; align-items: baseline; gap: 7px; min-width: 0; flex: 1; }
.r-title .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.r-parent { color: var(--text-3); font-size: 12px; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; flex: none; }
.r-parent::after { content: " ›"; color: var(--text-4); }
.r-sub { font: 500 10.5px var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 9px; padding: 1px 6px; flex: none; align-self: center; }
.r-meta { display: flex; align-items: center; gap: 7px; flex: none; }
.r-cp { color: var(--accent-text); display: inline-grid; opacity: .8; }
.drop-line { position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 5; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.empty { display: grid; place-items: center; text-align: center; padding: 72px 24px; color: var(--text-3); }
.empty h3 { color: var(--text); font-size: 15px; margin: 14px 0 4px; letter-spacing: -.01em; }
.empty p { margin: 0 0 16px; max-width: 380px; }
.empty .glyph { width: 56px; height: 56px; color: var(--text-4); }

/* ── board ──────────────────────────────────────────── */
.board { display: flex; gap: 10px; padding: 12px 14px; height: 100%; align-items: stretch; min-width: min-content; }
.col { width: 296px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 8px 12px; font-weight: 600; flex: none; }
.col-head .cnt { font: 500 11px var(--mono); color: var(--text-3); }
.col-head .icon-btn { width: 24px; height: 24px; margin-left: auto; }
.col-body { flex: 1; min-height: 60px; overflow-y: auto; padding: 2px 8px 10px; position: relative; display: flex; flex-direction: column; gap: 6px; }
.col.over { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.card { background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 10px 9px; cursor: default; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.card.cursor { border-color: var(--text-4); }
.card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--raised)); }
.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.card-top .r-id { width: auto; flex: 1; }
.card-title { font-weight: 500; line-height: 1.35; display: flex; gap: 7px; align-items: flex-start; }
.card-title .r-hit { margin: -3px -4px 0 -4px; }
.card.closed .card-title span { color: var(--text-3); }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.card-meta:empty { display: none; }
.card .drop-line { left: 0; right: 0; }

/* ── issue page ─────────────────────────────────────── */
.issue { display: grid; grid-template-columns: minmax(0, 1fr) 272px; height: 100%; }
.issue-main { overflow-y: auto; min-width: 0; }
.issue-inner { max-width: 780px; margin: 0 auto; padding: 30px 40px 120px; }
.i-crumbs { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.i-crumbs a:hover { color: var(--text); }
.i-title { width: 100%; background: none; border: 0; resize: none; font-size: 23px; font-weight: 650; letter-spacing: -.022em; line-height: 1.25; padding: 0; overflow: hidden; display: block; }
.i-title::placeholder, .i-desc-edit::placeholder { color: var(--text-4); }
.i-desc { margin-top: 14px; min-height: 60px; border-radius: 6px; cursor: text; }
.i-desc.blank { color: var(--text-3); }
.i-desc-edit { width: 100%; margin-top: 14px; min-height: 140px; background: var(--sunken); border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; resize: none; font: 13px/1.6 var(--mono); display: block; }
.i-desc-edit:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.i-hint { display: flex; gap: 12px; align-items: center; color: var(--text-3); font-size: 11.5px; margin-top: 6px; }
.i-section { margin-top: 30px; }
.i-section-head { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.i-section-head .icon-btn { width: 24px; height: 24px; margin-left: auto; }
.bar { height: 4px; border-radius: 2px; background: var(--active); overflow: hidden; width: 64px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.sub-row { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 6px; border-bottom: 1px solid var(--line); border-radius: 0; }
.sub-row:hover { background: var(--hover); }
.sub-row .r-title .t { font-weight: 500; }
.sub-add { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 9px; color: var(--text-3); }
.sub-add input { background: none; border: 0; flex: 1; }
.sub-add input::placeholder { color: var(--text-3); }
.feed { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.ev { display: flex; align-items: center; gap: 9px; color: var(--text-3); font-size: 12px; padding: 4px 2px; }
.ev b { font-weight: 500; color: var(--text-2); }
.ev .evdot { width: 18px; display: grid; place-items: center; flex: none; }
.ev .evdot::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); }
.ev.cp .evdot::after { background: var(--accent); }
.comment { border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px 12px; background: var(--raised); margin: 6px 0; }
.comment.cp { border-color: color-mix(in srgb, var(--accent) 35%, var(--line-2)); background: color-mix(in srgb, var(--accent) 5%, var(--raised)); }
.comment-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.comment-head b { color: var(--text); font-weight: 600; }
.comment-head .icon-btn { width: 22px; height: 22px; margin-left: auto; opacity: 0; }
.comment:hover .comment-head .icon-btn { opacity: 1; }
.composer { border: 1px solid var(--line-2); border-radius: 9px; background: var(--raised); margin-top: 10px; display: flex; flex-direction: column; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.composer textarea { background: none; border: 0; resize: none; padding: 11px 12px 4px; min-height: 60px; line-height: 1.5; }
.composer-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 6px 8px 8px; }
.issue-side { border-left: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; background: var(--sunken); }
.prop { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: start; min-height: 30px; }
.prop > span { color: var(--text-3); font-size: 12px; padding: 7px 0 0 6px; }
.prop-btn { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 8px; border-radius: 6px; font-weight: 500; width: 100%; min-width: 0; flex-wrap: wrap; }
.prop-btn:hover { background: var(--hover); }
.prop-btn.unset { color: var(--text-3); font-weight: 400; }
.side-sep { height: 1px; background: var(--line); margin: 12px 4px; }
.side-meta { color: var(--text-3); font-size: 11.5px; padding: 0 6px; line-height: 1.8; }
.side-actions { display: flex; flex-direction: column; gap: 2px; }
.side-actions .btn { width: 100%; justify-content: flex-start; }

/* markdown */
.md { line-height: 1.62; font-size: 13.5px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h2, .md h3, .md h4, .md h5 { margin: 20px 0 8px; letter-spacing: -.012em; line-height: 1.3; }
.md h2 { font-size: 18px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 13.5px; } .md h5 { font-size: 12.5px; color: var(--text-2); }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md li.task { list-style: none; margin-left: -22px; display: flex; gap: 8px; align-items: flex-start; }
.md li.task.on > span { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-4); }
.md li.task input { appearance: none; width: 15px; height: 15px; border: 1.5px solid var(--text-3); border-radius: 4px; margin: 3.5px 0 0; flex: none; cursor: pointer; display: grid; place-items: center; }
.md li.task input:checked { background: var(--accent); border-color: var(--accent); }
.md li.task input:checked::after { content: ""; width: 7px; height: 4px; border: solid var(--accent-ink); border-width: 0 0 1.8px 1.8px; transform: rotate(-45deg) translate(1px, -1px); }
.md code { font: 12px var(--mono); background: var(--active); padding: 1.5px 5px; border-radius: 4px; }
.md pre { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 10px; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--accent-text); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
.md a.ref { font-family: var(--mono); font-size: 12px; text-decoration: none; background: var(--active); padding: 1px 5px; border-radius: 4px; color: var(--text-2); }
.md blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 2px solid var(--line-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--line-2); margin: 16px 0; }
.md table { border-collapse: collapse; margin: 0 0 10px; font-size: 12.5px; }
.md th, .md td { border: 1px solid var(--line-2); padding: 5px 9px; text-align: left; }
.md th { background: var(--sunken); }

/* ── overlays ───────────────────────────────────────── */
#layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#layer > * { pointer-events: auto; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.42); animation: fade .12s; }
:root[data-theme="light"] .backdrop { background: rgba(40,35,20,.22); }
.backdrop.clear { background: transparent; animation: none; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } }
.menu { position: absolute; min-width: 220px; max-width: 340px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; animation: pop .1s ease-out; }
.menu-input { display: flex; align-items: center; gap: 8px; padding: 0 11px; height: 36px; border-bottom: 1px solid var(--line); flex: none; }
.menu-input input { flex: 1; background: none; border: 0; min-width: 0; }
.menu-input input::placeholder { color: var(--text-3); }
.menu-list { overflow-y: auto; padding: 4px; max-height: 320px; }
.menu-group { padding: 8px 8px 4px; }
.menu-item { display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 4px 8px; border-radius: 6px; width: 100%; color: var(--text); }
.menu-item.act { background: var(--active); }
.menu-item.danger { color: var(--red); }
.menu-item .ico { color: var(--text-2); }
.menu-item.danger .ico { color: inherit; }
.menu-item .hint { color: var(--text-3); font-size: 12px; margin-left: auto; padding-left: 12px; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.menu-item .tick { width: 14px; height: 14px; border: 1px solid var(--line-2); border-radius: 4px; flex: none; display: grid; place-items: center; }
.menu-item .tick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.menu-item .tick svg { width: 9px; height: 9px; stroke-width: 2.6; opacity: 0; }
.menu-item .tick.on svg { opacity: 1; }
.menu-item .sel { margin-left: auto; color: var(--text-2); display: grid; }
.menu-sep { height: 1px; background: var(--line); margin: 4px -4px; }
.menu-empty { padding: 14px 10px; color: var(--text-3); text-align: center; }
.menu.palette { position: absolute; left: 50%; top: 13vh; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); max-width: none; border-radius: 12px; animation: fade .1s; }
.menu.palette .menu-input { height: 50px; padding: 0 16px; font-size: 15px; }
.menu.palette .menu-list { max-height: min(420px, 60vh); padding: 6px; }
.menu.palette .menu-item { min-height: 36px; padding: 6px 10px; }
.menu-crumb { font: 500 11px var(--mono); color: var(--text-2); background: var(--active); padding: 3px 7px; border-radius: 5px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.dialog { position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); max-height: 78vh; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: fade .12s; }
.dialog.wide { width: min(720px, calc(100vw - 32px)); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 16px; flex: none; }
.dlg-head h2 { font-size: 14px; margin: 0; letter-spacing: -.01em; flex: 1; }
.dlg-body { padding: 12px 16px; overflow-y: auto; }
.dlg-body p { margin: 0 0 10px; color: var(--text-2); line-height: 1.55; }
.dlg-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex: none; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; color: var(--text-3); font-size: 12px; margin-bottom: 5px; }
.input, .field input[type=text], .field textarea, .field select { width: 100%; background: var(--sunken); border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 10px; }
.input:focus, .field input:focus, .field textarea:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 6px; border: 2px solid transparent; }
.swatch.on { border-color: var(--text); box-shadow: inset 0 0 0 2px var(--raised); }
.new-title { width: 100%; background: none; border: 0; font-size: 17px; font-weight: 600; letter-spacing: -.015em; padding: 2px 0 6px; }
.new-desc { width: 100%; background: none; border: 0; resize: none; min-height: 72px; line-height: 1.55; padding: 0; }
.new-title::placeholder, .new-desc::placeholder { color: var(--text-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-2); }
.chip:hover { background: var(--hover); color: var(--text); }
.chip.set { color: var(--text); }
.bulk-lines { max-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; margin-top: 4px; }
.bulk-lines div { padding: 4px 10px; display: flex; gap: 8px; }
.bulk-lines div::before { content: "+"; color: var(--accent-text); font-family: var(--mono); }
.check { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12px; cursor: pointer; margin-right: auto; }
.check input { accent-color: var(--accent); margin: 0; }
.toasts { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none !important; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 10px 9px 14px; box-shadow: var(--shadow); animation: rise .16s ease-out; max-width: min(560px, 90vw); }
.toast.err { border-color: color-mix(in srgb, var(--red) 50%, transparent); }
.toast .btn { height: 24px; color: var(--accent-text); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.bulkbar { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 11px; padding: 5px; box-shadow: var(--shadow); z-index: 10; animation: rise .14s ease-out; white-space: nowrap; }
.bulkbar .count { font: 600 12px var(--mono); padding: 0 10px 0 8px; color: var(--accent-text); }
.bulkbar .vr { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; }
.shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
.shortcuts h4 { grid-column: 1 / -1; margin: 12px 0 2px; }
.shortcuts h4:first-child { margin-top: 0; }
.shortcuts div { display: flex; align-items: center; justify-content: space-between; height: 26px; color: var(--text-2); }
.shortcuts div span:last-child { display: flex; gap: 4px; align-items: center; color: var(--text-3); font-size: 11px; }

/* ── copilot hub ────────────────────────────────────── */
.cp { max-width: 1120px; margin: 0 auto; padding: 26px 28px 120px; }
.cp-hero { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
.cp-hero h1 { font-size: 22px; letter-spacing: -.022em; margin: 0 0 4px; }
.cp-hero p { margin: 0; color: var(--text-2); max-width: 620px; }
.loop { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--text-3); font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.loop b { color: var(--accent-text); font-weight: 600; }
.loop i { width: 18px; height: 1px; background: var(--line-2); }
.cp-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cp-card { border: 1px solid var(--line-2); border-radius: 12px; background: var(--raised); padding: 16px; }
.cp-card + .cp-card { margin-top: 16px; }
.cp-card > header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cp-card > header h2 { font-size: 13.5px; margin: 0; letter-spacing: -.01em; }
.step-n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-text); display: grid; place-items: center; font: 600 10.5px var(--mono); flex: none; }
.recipes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.recipe { border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 10px 11px; display: flex; flex-direction: column; gap: 5px; min-height: 84px; background: var(--panel); }
.recipe:hover { border-color: var(--text-4); }
.recipe.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); box-shadow: 0 0 0 1px var(--accent); }

<script data-fd>
/* Flight Deck — core: data model, mutations, filters, markdown, Copilot protocol.
   Pure logic, no DOM. Runs in the browser and under `node --test`. */
(function (root) {
'use strict';
const FD = {};

/* ───────────────────────── constants ───────────────────────── */
FD.FORMAT = 'flightdeck/1';
FD.STATUSES = [
  { id: 'triage',   name: 'Triage',      type: 'triage' },
  { id: 'backlog',  name: 'Backlog',     type: 'backlog' },
  { id: 'todo',     name: 'Todo',        type: 'unstarted' },
  { id: 'progress', name: 'In Progress', type: 'started' },
  { id: 'review',   name: 'In Review',   type: 'started' },
  { id: 'done',     name: 'Done',        type: 'completed' },
  { id: 'canceled', name: 'Canceled',    type: 'canceled' }
];
FD.PRIORITIES = [
  { id: 1, name: 'Urgent' }, { id: 2, name: 'High' }, { id: 3, name: 'Medium' },
  { id: 4, name: 'Low' }, { id: 0, name: 'No priority' }

FD.FIELDS = ['title', 'status', 'priority', 'due', 'project', 'labels', 'parent', 'focus', 'assignee', 'description'];

const statusById = Object.fromEntries(FD.STATUSES.map(s => [s.id, s]));

const pad = n => String(n).padStart(2, '0');

FD.addDays = (iso, n) => { const d = FD.fromISO(iso); d.setDate(d.getDate() + n); return FD.iso(d); };
FD.dayDiff = (a, b) => Math.round((FD.fromISO(a) - FD.fromISO(b)) / 864e5);
FD.validISO = s => typeof s === 'string' && /^\d{4}-\d\d-\d\d$/.test(s) && FD.iso(FD.fromISO(s)) === s;

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* Natural-ish date input → 'YYYY-MM-DD' | '' (clear) | null (not understood) */
FD.parseDate = function (text, now = new Date()) {
  let s = String(text == null ? '' : text).trim().toLowerCase().replace(/[.,]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s || s === 'none' || s === 'no date' || s === 'clear' || s === 'null') return '';
  const t = FD.today(now);
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:t.*)?$/))) { const v = m[1] + '-' + pad(m[2]) + '-' + pad(m[3]); return FD.validISO(v) ? v : null; }
  if (s === 'today' || s === 'tod' || s === 'now') return t;
  if (s === 'tomorrow' || s === 'tmr' || s === 'tom' || s === 'tmrw') return FD.addDays(t, 1);

  if ((m = s.match(/^(\d{1,2})(?:st|nd|rd|th)? ([a-z]{3,9})(?: (\d{4}))?$/)) && MONTHS.includes(m[2].slice(0, 3))) return pick(m[3] ? +m[3] : null, MONTHS.indexOf(m[2].slice(0, 3)) + 1, +m[1]);
  return null;
};

FD.fmtDate = function (iso, now = new Date()) {
  if (!iso) return '';
  const diff = FD.dayDiff(iso, FD.today(now)), d = FD.fromISO(iso);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return DAY_NAMES[d.getDay()];
  return MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + (d.getFullYear() !== now.getFullYear() ? ', ' + d.getFullYear() : '');
};
FD.fmtDateLong = function (iso) {
  if (!iso) return '';

  return DAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();

FD.relTime = function (ts, now = Date.now()) {
  const s = Math.max(0, Math.round((now - ts) / 1000));
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  if (s < 86400 * 14) return Math.round(s / 86400) + 'd ago';
  const d = new Date(ts);
  return MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + (d.getFullYear() !== new Date(now).getFullYear() ? ', ' + d.getFullYear() : '');

FD.dueBucket = function (iso, now = new Date()) {
  if (!iso) return 'none';
  const diff = FD.dayDiff(iso, FD.today(now));

FD.DUE_BUCKETS = [
  { id: 'overdue', name: 'Overdue' }, { id: 'today', name: 'Due today' }, { id: 'week', name: 'Next 7 days' },
  { id: 'later', name: 'Later' }, { id: 'none', name: 'No due date' }
];

/* Subsequence fuzzy score; -1 when no match */
FD.fuzzy = function (query, text) {
  const q = query.toLowerCase(), t = String(text).toLowerCase();
  if (!q) return 0;
  const idx = t.indexOf(q);
  if (idx >= 0) return 1000 - idx - (t.length - q.length) * 0.01 + (idx === 0 || /\W/.test(t[idx - 1]) ? 50 : 0);
  let ti = 0, score = 0, streak = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi]; if (c === ' ') continue;
    const at = t.indexOf(c, ti);
    if (at < 0) return -1;
    streak = at === ti ? streak + 1 : 0;
    score += 10 + streak * 5 + (at === 0 || /\W/.test(t[at - 1]) ? 8 : 0) - Math.min(5, at - ti);
    ti = at + 1;
  }
  return score;
};

/* ───────────────────────── workspace ───────────────────────── */
FD.newWorkspace = function (opts = {}, now = Date.now()) {
  return {
    format: FD.FORMAT, id: FD.uid('ws_'), name: opts.name || 'My work', key: opts.key || 'FD',
    rev: 1, seq: 1, createdAt: now, updatedAt: now,
    issues: [], labels: [], projects: [], views: [], exchanges: [],
    prefs: { theme: 'system', accent: 'amber', wip: 3, me: '', display: {} }
  };
};

FD.findIssue = (state, id) => state.issues.find(i => i.id === id) || null;
FD.resolveId = function (state, raw) {
  if (raw == null) return null;
  const s = String(raw).trim().toUpperCase().replace(/^#/, '');
  const hit = state.issues.find(i => i.id.toUpperCase() === s);
  if (hit) return hit.id;
  if (/^\d+$/.test(s)) { const byN = state.issues.find(i => i.n === +s); if (byN) return byN.id; }
  return null;
};
FD.children = (state, id) => state.issues.filter(i => i.parent === id);
FD.descendants = function (state, id) {
  const out = [], walk = pid => { for (const c of state.issues) if (c.parent === pid && !out.includes(c)) { out.push(c); walk(c.id); } };
  walk(id); return out;
};
FD.label = (state, id) => state.labels.find(l => l.id === id) || null;
FD.project = (state, id) => state.projects.find(p => p.id === id) || null;
FD.labelNames = (state, issue) => issue.labels.map(id => FD.label(state, id)).filter(Boolean).map(l => l.name);
FD.projectName = (state, issue) => { const p = issue.project && FD.project(state, issue.project); return p ? p.name : ''; };
const sameName = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
FD.labelByName = (state, name) => state.labels.find(l => sameName(l.name, name)) || null;
FD.projectByName = (state, name) => state.projects.find(p => sameName(p.name, name)) || null;
FD.nextColor = list => { const used = list.map(x => x.color); return FD.COLORS.find(c => !used.includes(c)) || FD.COLORS[list.length % FD.COLORS.length]; };
FD.ensureLabel = function (state, name, color) {
  name = String(name).trim().slice(0, 40); if (!name) return null;
  let l = FD.labelByName(state, name);
  if (!l) { l = { id: FD.uid('l_'), name, color: color || FD.nextColor(state.labels) }; state.labels.push(l); }
  return l;
};
FD.ensureProject = function (state, name, color) {
  name = String(name).trim().slice(0, 60); if (!name) return null;
  let p = FD.projectByName(state, name);
  if (!p) { p = { id: FD.uid('p_'), name, color: color || FD.nextColor(state.projects), description: '', status: 'active', target: '' }; state.projects.push(p); }
  return p;
};
FD.people = function (state) {
  const set = new Map();
  for (const i of state.issues) if (i.assignee) set.set(i.assignee.toLowerCase(), i.assignee);
  return [...set.values()].sort((a, b) => a.localeCompare(b));
};
FD.progress = function (state, parentId) {
  const kids = FD.children(state, parentId).filter(k => k.status !== 'canceled');
  return { total: kids.length, done: kids.filter(k => k.status === 'done').length };
};
FD.projectProgress = function (state, projectId) {
  const list = state.issues.filter(i => i.project === projectId && i.status !== 'canceled');
  const done = list.filter(i => i.status === 'done').length;
  return { total: list.length, done, open: list.length - done, pct: list.length ? done / list.length : 0 };
};

/* Human-readable value for a field (used in history, diffs, prompts) */
FD.textOf = function (state, key, value) {
  switch (key) {
    case 'status': return FD.status(value).name;
    case 'priority': return value ? FD.priority(value).name : 'None';
    case 'due': return value || 'None';
    case 'labels': { const names = (value || []).map(id => { const l = FD.label(state, id); return l ? l.name : null; }).filter(Boolean); return names.length ? names.join(', ') : 'None'; }
    case 'project': { const p = value && FD.project(state, value); return p ? p.name : 'None'; }
    case 'parent': { const p = value && FD.findIssue(state, value); return p ? p.id : 'None'; }
    case 'focus': return value ? 'On' : 'Off';
    case 'assignee': return value || 'None';
    default: return String(value == null ? '' : value);
  }
};

/* ───────────────────────── mutations ─────────────────────────
   Callers bump state.rev first (FD.bump), then mutate; issue.rev records the
   workspace revision at which the issue last changed. */
FD.bump = function (state, now = Date.now()) { state.rev = (state.rev || 0) + 1; state.updatedAt = now; return state.rev; };

FD.maxOrder = state => state.issues.reduce((m, i) => Math.max(m, i.order || 0), 0);

FD.createIssue = function (state, f = {}, by = 'me', now = Date.now()) {
  const n = state.seq++;
  const issue = {
    id: state.key + '-' + n, n,
    title: String(f.title || '').trim().slice(0, 300) || 'Untitled',
    description: String(f.description || '').slice(0, 60000),
    status: statusById[f.status] ? f.status : 'todo',
    priority: prioById[f.priority] ? f.priority : 0,
    labels: Array.isArray(f.labels) ? [...new Set(f.labels.filter(id => FD.label(state, id)))] : [],
    project: f.project && FD.project(state, f.project) ? f.project : null,
    parent: f.parent && FD.findIssue(state, f.parent) ? f.parent : null,
    due: FD.validISO(f.due) ? f.due : '',
    focus: !!f.focus, assignee: String(f.assignee || '').trim().slice(0, 60),
    createdAt: now, updatedAt: now, completedAt: null,
    order: FD.maxOrder(state) + 1, rev: state.rev, born: state.rev, by,
    comments: [], history: []
  };
  if (FD.isClosed(issue)) { issue.completedAt = now; issue.focus = false; }
  state.issues.push(issue);
  return issue;
};

const sameValue = (a, b) => JSON.stringify(a == null ? null : a) === JSON.stringify(b == null ? null : b);

FD.wouldCycle = function (state, issueId, parentId) {
  let cur = parentId, guard = 0;
  while (cur && guard++ < 1000) { if (cur === issueId) return true; const p = FD.findIssue(state, cur); cur = p ? p.parent : null; }
  return false;
};

FD.setField = function (state, issue, key, value, by = 'me', now = Date.now()) {
  let v = value;
  switch (key) {
    case 'title': v = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 300); if (!v) return false; break;
    case 'description': v = String(v || '').slice(0, 60000); break;
    case 'status': if (!statusById[v]) return false; break;
    case 'priority': v = Number(v) || 0; if (!prioById[v]) return false; break;
    case 'due': v = v || ''; if (v && !FD.validISO(v)) return false; break;
    case 'labels': v = [...new Set((v || []).filter(id => FD.label(state, id)))]; break;
    case 'project': v = v && FD.project(state, v) ? v : null; break;
    case 'parent': v = v && FD.findIssue(state, v) ? v : null; if (v && (v === issue.id || FD.wouldCycle(state, issue.id, v))) return false; break;
    case 'focus': v = !!v; break;
    case 'assignee': v = String(v || '').trim().slice(0, 60); break;
    default: return false;
  }
  const before = issue[key];
  if (sameValue(before, v)) return false;
  const entry = { at: now, by, k: key };
  if (key !== 'description') { entry.from = FD.textOf(state, key, before); entry.to = FD.textOf(state, key, v); }
  issue[key] = v;
  if (key === 'status') {
    if (FD.isClosed(issue)) { issue.completedAt = issue.completedAt || now; issue.focus = false; }
    else issue.completedAt = null;
  }
  const last = issue.history[issue.history.length - 1];
  if (last && last.k === key && last.by === by && now - last.at < 120000 && (key === 'description' || key === 'title')) { last.at = now; if (key === 'title') last.to = entry.to; }
  else issue.history.push(entry);
  if (issue.history.length > 80) issue.history.splice(0, issue.history.length - 80);
  issue.updatedAt = now; issue.rev = state.rev;
  return true;
};

FD.addComment = function (state, issue, body, by = 'me', now = Date.now()) {
  body = String(body || '').trim().slice(0, 20000); if (!body) return null;
  const c = { id: FD.uid('c_'), by, body, at: now };
  issue.comments.push(c); issue.updatedAt = now; issue.rev = state.rev;
  return c;
};

FD.deleteIssue = function (state, id) {
  const idx = state.issues.findIndex(i => i.id === id); if (idx < 0) return false;
  const gone = state.issues[idx];
  for (const c of state.issues) if (c.parent === id) { c.parent = gone.parent || null; c.rev = state.rev; }
  state.issues.splice(idx, 1);
  return true;
};

/* Place `ids` before `beforeId` (or at the end) among `siblings` (already sorted by order). */
FD.reorder = function (state, ids, siblings, beforeId) {
  const rest = siblings.filter(i => !ids.includes(i.id));
  const at = beforeId ? rest.findIndex(i => i.id === beforeId) : -1;
  const prev = at < 0 ? rest[rest.length - 1] : rest[at - 1];
  const next = at < 0 ? null : rest[at];
  const lo = prev ? prev.order : (next ? next.order - 2 : FD.maxOrder(state));
  const hi = next ? next.order : lo + 2;
  const step = (hi - lo) / (ids.length + 1);
  ids.forEach((id, k) => { const i = FD.findIssue(state, id); if (i) i.order = lo + step * (k + 1); });
  if (step < 1e-7) [...state.issues].sort((a, b) => a.order - b.order).forEach((i, k) => { i.order = k + 1; });
};

/* ───────────────────────── normalize / import ───────────────────────── */
FD.normalize = function (raw) {
  if (!raw || typeof raw !== 'object') throw new Error('Not a Flight Deck file.');
  if (raw.format === 'pilot-board/1') return FD.importPilotBoard(raw);
  if (raw.format !== FD.FORMAT) throw new Error('Not a Flight Deck file.');
  const now = Date.now(), base = FD.newWorkspace({}, now);
  const s = Object.assign(base, {
    id: typeof raw.id === 'string' && raw.id ? raw.id : base.id,
    name: String(raw.name || 'My work').slice(0, 80),
    key: /^[A-Z][A-Z0-9]{0,5}$/.test(raw.key) ? raw.key : 'FD',
    rev: Number.isSafeInteger(raw.rev) && raw.rev > 0 ? raw.rev : 1,
    createdAt: +raw.createdAt || now, updatedAt: +raw.updatedAt || now
  });
  s.labels = (Array.isArray(raw.labels) ? raw.labels : []).filter(l => l && l.id && l.name).map(l => ({ id: String(l.id), name: String(l.name).slice(0, 40), color: /^#[0-9a-f]{6}$/i.test(l.color) ? l.color : FD.COLORS[0] }));
  s.projects = (Array.isArray(raw.projects) ? raw.projects : []).filter(p => p && p.id && p.name).map(p => ({ id: String(p.id), name: String(p.name).slice(0, 60), color: /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : FD.COLORS[5], description: String(p.description || ''), status: ['active', 'paused', 'done'].includes(p.status) ? p.status : 'active', target: FD.validISO(p.target) ? p.target : '' }));
  const labelIds = new Set(s.labels.map(l => l.id)), projIds = new Set(s.projects.map(p => p.id));
  const seen = new Set(); let maxN = 0;
  s.issues = (Array.isArray(raw.issues) ? raw.issues : []).filter(i => i && typeof i.id === 'string' && !seen.has(i.id) && seen.add(i.id)).map((i, k) => {
    const n = Number.isSafeInteger(i.n) ? i.n : (+String(i.id).split('-').pop() || k + 1); maxN = Math.max(maxN, n);
    return {
      id: i.id, n, title: String(i.title || 'Untitled').slice(0, 300), description: String(i.description || ''),
      status: statusById[i.status] ? i.status : 'todo', priority: prioById[i.priority] ? i.priority : 0,
      labels: (Array.isArray(i.labels) ? i.labels : []).filter(id => labelIds.has(id)),
      project: projIds.has(i.project) ? i.project : null, parent: typeof i.parent === 'string' ? i.parent : null,
      due: FD.validISO(i.due) ? i.due : '', focus: !!i.focus, assignee: String(i.assignee || ''),
      createdAt: +i.createdAt || now, updatedAt: +i.updatedAt || now, completedAt: i.completedAt ? +i.completedAt : null,
      order: typeof i.order === 'number' && isFinite(i.order) ? i.order : k + 1,
      rev: +i.rev || 1, born: +i.born || 1, by: i.by === 'copilot' ? 'copilot' : 'me',
      comments: (Array.isArray(i.comments) ? i.comments : []).filter(c => c && c.body).map(c => ({ id: c.id || FD.uid('c_'), by: c.by === 'copilot' ? 'copilot' : 'me', body: String(c.body), at: +c.at || now })),
      history: (Array.isArray(i.history) ? i.history : []).filter(h => h && h.k).slice(-80)
    };
  });
  for (const i of s.issues) if (i.parent && (!seen.has(i.parent) || i.parent === i.id)) i.parent = null;
  s.seq = Math.max(Number.isSafeInteger(raw.seq) ? raw.seq : 1, maxN + 1);
  s.views = (Array.isArray(raw.views) ? raw.views : []).filter(v => v && v.id && v.name).map(v => ({ id: String(v.id), name: String(v.name).slice(0, 60), filters: v.filters && typeof v.filters === 'object' ? v.filters : {}, display: v.display && typeof v.display === 'object' ? v.display : {} }));
  s.exchanges = (Array.isArray(raw.exchanges) ? raw.exchanges : []).filter(x => x && x.id && Number.isFinite(x.base)).slice(-12);
  s.prefs = Object.assign(base.prefs, raw.prefs && typeof raw.prefs === 'object' ? raw.prefs : {});
  if (!s.prefs.display || typeof s.prefs.display !== 'object') s.prefs.display = {};
  s.prefs.wip = Math.min(20, Math.max(1, +s.prefs.wip || 3));
  return s;
};

/* Import a JSON backup from the earlier "Pilot Board" (format pilot-board/1). */
FD.importPilotBoard = function (raw) {
  const now = Date.now(), s = FD.newWorkspace({ name: raw.name || 'Work board', key: 'PB' }, now);
  const map = { 'Backlog': 'backlog', 'In progress': 'progress', 'In review': 'review', 'Done': 'done' };
  const prio = { Urgent: 1, High: 2, Medium: 3, Low: 4 };
  for (const t of Array.isArray(raw.tasks) ? raw.tasks : []) {
    const n = +String(t.id).split('-').pop() || s.seq; s.seq = n;
    const label = t.label ? FD.ensureLabel(s, t.label) : null;
    FD.createIssue(s, { title: t.title, description: t.description, status: map[t.status] || 'backlog', priority: prio[t.priority] || 0, labels: label ? [label.id] : [], due: t.due, assignee: t.owner }, 'me', now);
  }
  s.seq = Math.max(s.seq, +raw.next || 1);
  return s;
};

FD.starter = function (now = Date.now()) {
  const s = FD.newWorkspace({}, now), t = FD.today(new Date(now));
  const guide = FD.ensureProject(s, 'Getting started', '#f5a524');
  guide.description = 'A short tour. Finish or delete these whenever you like.';
  const L = n => FD.ensureLabel(s, n).id;
  const mk = (title, f, description) => FD.createIssue(s, Object.assign({ title, description, project: guide.id }, f), 'me', now);
  mk('Welcome aboard — open me (Enter) for the 60-second tour', { status: 'progress', priority: 2, focus: true, labels: [L('Guide')], due: t },
    'Flight Deck is your task **source of truth**. It lives in this one HTML file and in this browser — nothing is sent anywhere.\n\n**Copilot is the co-pilot.** You hand it a snapshot, it proposes changes, you approve a diff.\n\n### Try these\n- [ ] Press `C` to create an issue\n- [ ] Hover any row and press `S`, `P`, `L` or `D` to change status, priority, labels or due date\n- [ ] Press `⌘K` for the command menu — everything is in there\n- [ ] Press `X` to select a few issues, then `E` to hand them to Copilot\n- [ ] Press `?` for every shortcut\n\nEsc takes you back.');
  mk('Run your first Copilot round-trip', { status: 'todo', priority: 2, focus: true, labels: [L('Copilot')], due: FD.addDays(t, 1) },
    '1. Press `G` then `C` to open **Copilot**.\n2. Pick a recipe — *Enrich* is a good first one — and press **Copy prompt**.\n3. Paste into your work Copilot chat. It answers with a JSON block.\n4. Copy its whole reply, come back here and press `⌘V` anywhere.\n5. Review the diff, untick anything you don’t want, and apply.\n\nEvery batch is a single undo (`⌘Z`).');
  mk('Make this file save itself', { status: 'todo', priority: 3, labels: [L('Guide')], due: FD.addDays(t, 2) },
    'By default your work is stored in this browser profile. To make the **HTML file itself** the source of truth:\n\n- Open **Settings → Storage** and choose **Save into this file**.\n- Pick this same file in the dialog. From then on every change is written into it.\n\nIf your browser policy blocks that, use **Download a copy** from time to time — the copy carries all of your data.');
  const brain = mk('Let Copilot sweep your inbox and meetings for action items', { status: 'backlog', priority: 3, labels: [L('Copilot')] },
    'The *Sweep my work* recipe asks Copilot to look through recent emails, chats and meetings for commitments that are not on the board yet. New items land in **Triage** for you to accept.');
  mk('Review what the sweep found in Triage', { status: 'backlog', parent: brain.id, labels: [L('Copilot')] }, '');
  mk('Something you jotted down quickly', { status: 'triage', project: null },
    'Quick captures and Copilot finds land in **Triage**. Press `1` to accept into Todo, `2` for Backlog, or `S` for anything else.');
  mk('Skim the keyboard shortcuts', { status: 'done', priority: 4, labels: [L('Guide')] }, 'Press `?` any time.');
  return s;
};

/* ───────────────────────── filters, grouping, sorting ───────────────────────── */
FD.BASE_VIEWS = {
  inbox:   { name: 'Triage',     test: i => i.status === 'triage' },
  focus:   { name: 'Focus',      test: i => i.focus && FD.isOpen(i) },
  active:  { name: 'Active',     test: i => i.status === 'todo' || i.status === 'progress' || i.status === 'review' },
  backlog: { name: 'Backlog',    test: i => i.status === 'backlog' },
  all:     { name: 'All issues', test: () => true }
};
FD.emptyFilters = () => ({ status: [], priority: [], labels: [], project: [], assignee: [], due: [], flags: [], text: '' });
FD.filterCount = f => ['status', 'priority', 'labels', 'project', 'assignee', 'due', 'flags'].reduce((n, k) => n + ((f[k] || []).length ? 1 : 0), 0);
FD.matches = function (state, issue, f, now = new Date()) {
  if (!f) return true;
  if (f.status && f.status.length && !f.status.includes(issue.status)) return false;
  if (f.priority && f.priority.length && !f.priority.includes(issue.priority)) return false;
  if (f.labels && f.labels.length && !(f.labels.some(id => id === 'none' ? !issue.labels.length : issue.labels.includes(id)))) return false;
  if (f.project && f.project.length && !f.project.includes(issue.project || 'none')) return false;
  if (f.assignee && f.assignee.length && !f.assignee.includes(issue.assignee || 'none')) return false;
  if (f.due && f.due.length && !f.due.includes(FD.dueBucket(issue.due, now))) return false;
  if (f.flags && f.flags.length) {
    for (const flag of f.flags) {
      if (flag === 'focus' && !issue.focus) return false;
      if (flag === 'nodesc' && issue.description.trim()) return false;
      if (flag === 'copilot' && issue.by !== 'copilot') return false;
      if (flag === 'top' && issue.parent) return false;
    }
  }
  if (f.text && f.text.trim()) {
    const q = f.text.trim().toLowerCase();
    const hay = (issue.id + ' ' + issue.title + ' ' + issue.description + ' ' + issue.assignee + ' ' + FD.labelNames(state, issue).join(' ') + ' ' + FD.projectName(state, issue)).toLowerCase();
    for (const word of q.split(/\s+/)) if (!hay.includes(word)) return false;
  }
  return true;
};

FD.SORTS = [
  { id: 'manual', name: 'Manual' }, { id: 'priority', name: 'Priority' }, { id: 'due', name: 'Due date' },
  { id: 'updated', name: 'Last updated' }, { id: 'created', name: 'Created' }, { id: 'title', name: 'Title' }
];
FD.GROUPS = [
  { id: 'status', name: 'Status' }, { id: 'priority', name: 'Priority' }, { id: 'project', name: 'Project' },
  { id: 'label', name: 'Label' }, { id: 'due', name: 'Due date' }, { id: 'assignee', name: 'Assignee' }, { id: 'none', name: 'No grouping' }
];
const prioRank = p => (p === 0 ? 5 : p);
FD.sorter = function (sort) {
  const manual = (a, b) => a.order - b.order;
  switch (sort) {
    case 'priority': return (a, b) => prioRank(a.priority) - prioRank(b.priority) || manual(a, b);
    case 'due': return (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || prioRank(a.priority) - prioRank(b.priority) || manual(a, b);
    case 'updated': return (a, b) => b.updatedAt - a.updatedAt || manual(a, b);
    case 'created': return (a, b) => b.createdAt - a.createdAt || b.n - a.n;
    case 'title': return (a, b) => a.title.localeCompare(b.title);
    default: return manual;
  }
};
/* → [{ key, name, kind, value, issues }] ; `value` is what dropping an issue into the group sets. */
FD.group = function (state, issues, groupBy, sort, now = new Date()) {
  const cmp = FD.sorter(sort), groups = [];
  const add = (key, name, value, test, extra) => { const list = issues.filter(test).sort(cmp); groups.push(Object.assign({ key, name, value, issues: list }, extra)); };
  switch (groupBy) {
    case 'status': for (const s of FD.STATUSES) add(s.id, s.name, s.id, i => i.status === s.id, { field: 'status' }); break;
    case 'priority': for (const p of FD.PRIORITIES) add('p' + p.id, p.name, p.id, i => i.priority === p.id, { field: 'priority' }); break;
    case 'project':
      for (const p of state.projects) add(p.id, p.name, p.id, i => i.project === p.id, { field: 'project', color: p.color });
      add('none', 'No project', null, i => !i.project, { field: 'project' }); break;
    case 'label':
      for (const l of state.labels) add(l.id, l.name, l.id, i => i.labels.includes(l.id), { color: l.color });
      add('none', 'No label', null, i => !i.labels.length, {}); break;
    case 'due': for (const b of FD.DUE_BUCKETS) add(b.id, b.name, b.id, i => FD.dueBucket(i.due, now) === b.id, {}); break;
    case 'assignee':
      for (const name of FD.people(state)) add('a:' + name, name, name, i => i.assignee === name, { field: 'assignee' });
      add('none', 'Unassigned', '', i => !i.assignee, { field: 'assignee' }); break;
    default: add('all', 'Issues', null, () => true, {});
  }
  return groups;
};

/* ───────────────────────── markdown (safe subset) ───────────────────────── */
const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
FD.esc = escHtml;

function inlineMd(src, opts) {
  const stash = [];
  const keep = html => { stash.push(html); return '\u0000' + (stash.length - 1) + '\u0000'; };
  let s = String(src);
  s = s.replace(/`([^`\n]+)`/g, (_, c) => keep('<code>' + escHtml(c) + '</code>'));
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, text, url) => /^(https?:\/\/|mailto:)/i.test(url) ? keep('<a href="' + escHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escHtml(text) + '</a>') : m);
  s = s.replace(/\bhttps?:\/\/[^\s<>()\u0000]+[^\s<>().,;:!?\u0000'"]/g, url => keep('<a href="' + escHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escHtml(url) + '</a>'));
  s = escHtml(s);
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^\w])__([^_\n]+?)__(?!\w)/g, '$1<strong>$2</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![*\w])/g, '$1<em>$2</em>').replace(/(^|[^\w])_([^_\s][^_\n]*?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');
  if (opts && opts.key) s = s.replace(new RegExp('\\b(' + opts.key + '-\\d+)\\b', 'g'), (m, id) => opts.has && !opts.has(id) ? m : '<a class="ref" href="#/issue/' + id + '">' + id + '</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, n) => stash[+n]);
}

const LIST_RE = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;
FD.md = function (src, opts) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = []; let i = 0, task = 0;
  const isBlockStart = l => /^```/.test(l) || /^#{1,4}\s/.test(l) || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l) || /^>/.test(l) || LIST_RE.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push('<pre><code>' + escHtml(buf.join('\n')) + '</code></pre>'); continue;
    }
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*?)\s*#*\s*$/))) { const lvl = Math.min(4, m[1].length + 1); out.push('<h' + lvl + '>' + inlineMd(m[2], opts) + '</h' + lvl + '>'); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push('<blockquote>' + FD.md(buf.join('\n'), opts) + '</blockquote>'); continue;
    }

  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push({ t: '=', s: A[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push({ t: '-', s: A[i++] });
    else out.push({ t: '+', s: B[j++] });

  while (j < m) out.push({ t: '+', s: B[j++] });

/* ── settings ───────────────────────────────────────── */

<script data-fd>
/* Flight Deck — app: rendering loop, routing, actions, keyboard, drag-and-drop, boot. */
'use strict';

/* ── render ─────────────────────────────────────────── */
function flushEditors() {

  if (Object.keys(patch).length) Store.mutate('Edit ' + id, s => { const i = FD.findIssue(s, id); for (const k in patch) FD.setField(s, i, k, patch[k]); }, { silent: true, coalesce: 'edit:' + id });
}
function render() {

  const shell = $('.shell', app), main = $('#main'), side = $('#sidebar');

  const scroll = {}; $$('[data-scroll]', main).forEach(el => { scroll[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
  const nav = $('.sb-nav', side), navTop = nav ? nav.scrollTop : 0;
  shell.classList.toggle('sb-off', !!S().prefs.sbOff); shell.classList.toggle('sb-open', ui.sbOpen);
  side.innerHTML = renderSidebar();
  $('.sb-nav', side).scrollTop = navTop;
  const r = ui.route;
  main.innerHTML = isListRoute(r) ? renderListView() : r.name === 'issue' ? renderIssue() : r.name === 'projects' ? renderProjects() : r.name === 'copilot' ? renderCopilot() : renderSettings();
  $$('[data-scroll]', main).forEach(el => { const v = scroll[el.dataset.scroll]; if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; } });
  $$('.i-title, .i-desc-edit', main).forEach(autosize);
  if (keep) { const el = $('[data-keep="' + keep.key + '"]', main); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text field */ } } }

}
function applyTheme() {
  const p = S().prefs, dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

/* ── desktop app (installable when served from a web address) ── */
const PWA = { evt: null, web: /^https?:$/.test(location.protocol), installed: matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches };
function pwaInit() {

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.evt = e; refresh(); });
  window.addEventListener('appinstalled', () => { PWA.evt = null; PWA.installed = true; refresh(); toast('Installed. Flight Deck now has its own window and icon.'); });

const appWindowCommand = () => { const url = location.href.split('#')[0]; return isMac ? 'open -na "Microsoft Edge" --args --app="' + url + '"' : 'start msedge --app="' + url + '"'; };
async function installApp() {

/* ── routing ────────────────────────────────────────── */
function parseRoute() {

}
function onRoute() {

  const r = parseRoute();

  if (isListRoute(r)) { const path = routePath(r); if (path !== ui.lastList) { ui.selected.clear(); ui.anchor = null; } ui.lastList = path; }

}
function go(path) { const h = '#/' + path; if (location.hash === h) onRoute(); else location.hash = h; }
const goBack = () => go(ui.lastList);

/* ── mutations ──────────────────────────────────────── */
const undoToast = (msg, extra) => toast(msg, Object.assign({ action: 'Undo', run: doUndo }, extra));

function doRedo() { const l = Store.redo(); toast(l ? 'Redone: ' + l : 'Nothing to redo'); }
function setField(ids, key, value) {
  let n = 0;
  Store.mutate('Change ' + FD.FIELD_LABELS[key].toLowerCase(), s => { for (const id of ids) { const i = FD.findIssue(s, id); if (i && FD.setField(s, i, key, value)) n++; } });
  if (!n) return;
  const gone = isListRoute() && ids.some(id => !ui.visible.includes(id));
  if (ids.length > 1 || gone) undoToast((ids.length === 1 ? ids[0] : n + ' issues') + ' · ' + FD.FIELD_LABELS[key].toLowerCase() + ' → ' + FD.textOf(S(), key, value));
}
function deleteIssues(ids) {
  if (!ids.length) return;
  const onPage = ui.route.name === 'issue' && ids.includes(ui.route.id);
  Store.mutate(ids.length === 1 ? 'Delete ' + ids[0] : 'Delete ' + ids.length + ' issues', s => ids.forEach(id => FD.deleteIssue(s, id)), { silent: onPage });

function setDisplay(patch) { const k = viewKey(); Store.touch(s => { s.prefs.display[k] = Object.assign({}, s.prefs.display[k], patch); }); }
function targets() {
  if (ui.route.name === 'issue') return FD.findIssue(S(), ui.route.id) ? [ui.route.id] : [];
  if (!isListRoute()) return [];
  if (ui.selected.size) return ui.visible.filter(id => ui.selected.has(id)).concat([...ui.selected].filter(id => !ui.visible.includes(id)));
  return ui.cursor && FD.findIssue(S(), ui.cursor) ? [ui.cursor] : [];
}

/* ── cursor + selection ─────────────────────────────── */
function setCursor(id, scroll) {
  ui.cursor = id; ui.cursorIndex = Math.max(0, ui.visible.indexOf(id));
  $$('#main .cursor').forEach(e => e.classList.remove('cursor'));
  if (!id) return;
  $$('#main .row[data-id="' + id + '"], #main .card[data-id="' + id + '"]').forEach((e, k) => { e.classList.add('cursor'); if (scroll && !k) e.scrollIntoView({ block: 'nearest' }); });
}
function scrollCursor() { const e = ui.cursor && $('#main [data-id="' + ui.cursor + '"]'); if (e) e.scrollIntoView({ block: 'nearest' }); }
function moveCursor(d, extend) {
  const v = ui.visible; if (!v.length) return;
  let at = v.indexOf(ui.cursor);
  at = at < 0 ? (d > 0 ? 0 : v.length - 1) : Math.min(v.length - 1, Math.max(0, at + d));
  ui.kbdNav = true;
  if (extend) { if (ui.cursor) ui.selected.add(ui.cursor); ui.selected.add(v[at]); ui.cursor = v[at]; ui.cursorIndex = at; render(); scrollCursor(); return; }

}
function toggleSelect(id, range) {

    const a = ui.visible.indexOf(ui.anchor), b = ui.visible.indexOf(id);
    ui.visible.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => ui.selected.add(x));
  } else { if (ui.selected.has(id)) ui.selected.delete(id); else ui.selected.add(id); ui.anchor = id; }
  ui.cursor = id; render();
}

/* ── property pickers ───────────────────────────────── */
function issueTarget(ids) {
  const list = () => ids.map(id => FD.findIssue(S(), id)).filter(Boolean);
  return {
    ids, crumb: ids.length === 1 ? ids[0] : ids.length + ' issues',
    get(key) { const l = list(); if (!l.length) return undefined; const v = JSON.stringify(l[0][key]); return l.every(i => JSON.stringify(i[key]) === v) ? l[0][key] : undefined; },

    toggleLabel(id) { const on = this.hasLabel(id); Store.mutate('Change labels', s => { for (const i of ids.map(x => FD.findIssue(s, x)).filter(Boolean)) FD.setField(s, i, 'labels', on ? i.labels.filter(x => x !== id) : [...i.labels, id]); }); }
  };
}
function draftTarget(d, onChange) {
  return { ids: [], crumb: 'New issue', get: k => d[k], set(k, v) { d[k] = v; onChange(); }, hasLabel: id => d.labels.includes(id), toggleLabel(id) { d.labels = d.labels.includes(id) ? d.labels.filter(x => x !== id) : [...d.labels, id]; onChange(); } };
}
const dot = (color, square) => '<i class="' + (square ? 'sb-dot' : 'gdot') + '" style="background:' + (color || 'var(--text-4)') + (square ? ';margin:0 2px' : '') + '"></i>';

  status(tg, anchor) {

  },
  priority(tg, anchor) {

    Menu.open({ anchor, crumb: tg.crumb, placeholder: 'Set priority…', items: [0, 1, 2, 3, 4].map(p => ({ label: FD.priority(p).name, icon: prioIcon(p), selected: cur === p, key: String(p), kbd: String(p), run: () => tg.set('priority', p) })) });
  },
  labels(tg, anchor) {
    Menu.open({
      anchor, crumb: tg.crumb, placeholder: 'Add or remove labels…', multi: true, empty: 'Type a name to create a label',
